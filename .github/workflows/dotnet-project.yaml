name: Complate Dotnet Project

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          repository: KhajasCICDSamples/nopCommerce-sep25
          ref: develop

      - name: Restore
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build
        run: dotnet build --configuration Release --no-restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Test
        run: |
          dotnet test \
            --configuration Release \
            --logger:"trx;LogFileName=testResults.trx" \
            --results-directory "${{ github.workspace }}/TestResults" \
            src/Tests/Nop.Tests/Nop.Tests.csproj

      - name: Check test results
        if: always()
        run: |
          echo "=== TestResults ==="
          find TestResults -type f -print

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/**/*.trx

      - name: Publish
        run: |
          dotnet publish \
            --configuration Release \
            src/Presentation/Nop.Web/Nop.Web.csproj \
            --output published

      - name: Create deployment ZIP
        run: |
          zip -r "${{ github.event.repository.name }}-${{ github.run_number }}.zip" published

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}.zip
          path: ${{ github.event.repository.name }}-${{ github.run_number }}.zip
